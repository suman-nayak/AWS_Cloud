# Copy to: /etc/httpd/conf.d/proxy.conf
# Verify with: sudo httpd -t && sudo systemctl enable --now httpd

<VirtualHost *:80>
    ServerName _

    # Disable forward proxying
    ProxyRequests Off
    ProxyPreserveHost On

    # Pass client protocol/IP headers to Express
    RequestHeader set X-Forwarded-Proto "http"

    # Allow 5 MB file uploads plus multipart form overhead (~6 MB)
    LimitRequestBody 6291456

    # Explicitly preserve /health for AWS ALB Target Group health checks
    ProxyPass /health http://127.0.0.1:3000/health timeout=5 retry=0
    ProxyPassReverse /health http://127.0.0.1:3000/health

    # Proxy all application and /uploads traffic to Node.js on localhost:3000
    ProxyPass / http://127.0.0.1:3000/ timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog /var/log/httpd/cloudboard-error.log
    CustomLog /var/log/httpd/cloudboard-access.log combined
</VirtualHost>
